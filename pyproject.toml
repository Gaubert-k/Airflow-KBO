[project]
name = "belgian-companies-platform"
version = "0.1.0"
description = "Plateforme données entreprises belges — fondations MS-00"
readme = "README_DEV.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "apache-airflow==3.2.1",
    "ruff==0.8.6",
    "pytest==8.3.4",
    "requests>=2.31.0",
    "PySocks>=1.7.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["airflow/dags", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
